
name: IPTV Automatic Playlist Update

on:
  schedule:
    # Run every 3 hours (UTC)
    - cron: '0 */3 * * *'

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-playlist-update
  cancel-in-progress: false

jobs:
  update-playlist:
    name: Update IPTV Playlist
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Fetch playlist using User-Agent
      - name: Fetch IPTV Playlist
        env:
          API_URL: https://ranapk-playlist.site/SONYBD.php
          API_USER_AGENT: Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Mobile Safari/537.36
        run: |
          python scripts/update.py

      # 5. Check generated files
      - name: Verify Output
        run: |
          if [ ! -d output ]; then
            echo "Output directory not found!"
            exit 1
          fi

          echo "Generated files:"
          find output -maxdepth 1 -type f -print

          COUNT=$(find output -maxdepth 1 -type f | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "No playlist files generated!"
            exit 1
          fi

          echo "Total generated files: $COUNT"

      # 6. Commit updated files
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if ! git diff --cached --quiet; then
            git commit -m "Automatic IPTV playlist update"
            git push
          else
            echo "No changes detected."
          fi
